<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Old Time Computer Museum</title>
</head>
<body>
    <main class="form">
        <h1>Old Time Computer Museum</h1>
        <form action ="#" method="post">
            <fieldset>
                <legend>Pledge Maker Information</legend>

                <label for="full-name">
                Full Name
                <input type="text" id="full-name" name="full_name" required>
                </label>
                <br />
                <label for="street-address">
                Street Address
                <input type="text" id="street-address" name="street_address" required>
                </label>
                <br />
                <label for="city">
                City
                <input type="text" id="city" name="city" required>
                </label>

                <label for="state">
                State
                <input type="text" id="state" name="state" required>
                </label>

                <label for"zip-code">
                Zip Code
                <input type="text" id="zip-code" name="zip_code" required>
                </label>
                <br />
                <label for="email">
                Email Address
                <input type="text" id="email" name="email" required>
                </label>
                <br />
                <label for"telephone-number">
                Telephone Number
                <input type="text" id="telephone-number" name="telephone_number">
                </label>
            </fieldset>

            <fieldset>
                <legend>Pledge Levels</legend>

                <label class="choice-label">
                <input type="radio" name="pledge-level" value="student-20" required>
                Student $20
                </label>


                <label class="choice-label">
                <input type="radio" name="pledge-level" value="individual-45" required>
                Individual $45
                </label>


                <label class="choice-label">
                <input type="radio" name="pledge-level" value="family-60" required>
                Family $60
                </label>


                <label class="choice-label">
                <input type="radio" name="pledge-level" value="patron-250" required>
                Patron $250
                </label>


                <label class="choice-label">
                <input type="radio" name="pledge-level" value="benefactor-750" required>
                Benefactor $750
                </label>
            </fieldset>

            <fieldset>
            <legend>Name of honoree or in-memory of: </legend>
                <label for"honoree">
                Honoree's Name
                <input type="text" id="honoree" name="honoree">
                </label>
            </fieldset>

            <button type="submit">Submit Pledge</button>

        </form>
    </main>
</body>
</html>
